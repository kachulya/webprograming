<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №4</title>
    <style>
        body { font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        /* CSS класи для тем */
        body.dark-mode { background-color: #333; color: #f4f4f4; }
        .modal { display: none; position: fixed; top: 20%; left: 50%; transform: translate(-50%, 0); border: 1px solid #ccc; padding: 20px; background-color: inherit; z-index: 1000; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .review-card { border: 1px solid #ddd; margin-bottom: 10px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <button id="themeToggle">Перемкнути тему</button>
    
    <h2>Відгуки:</h2>
    <div id="reviewsContainer"></div>

    <!-- Модальне вікно форми -->
    <div id="feedbackModal" class="modal">
        <h3>Зворотний зв'язок</h3>
        <form action="https://formspree.io/f/mqpeodgp" method="POST">
            <input type="text" name="name" placeholder="Ім'я" required><br><br>
            <input type="email" name="email" placeholder="Email" required><br><br>
            <input type="tel" name="phone" placeholder="Номер телефону"><br><br>
            <textarea name="message" placeholder="Ваше повідомлення" required></textarea><br><br>
            <button type="submit">Надіслати</button>
            <button type="button" id="closeModal">Закрити</button>
        </form>
    </div>

    <footer id="siteFooter" style="margin-top: 50px; border-top: 1px solid #ccc; padding-top: 10px;"></footer>

    <script>
        // 1. LocalStorage: Збереження та відображення даних ОС та браузера
        localStorage.setItem('os_info', navigator.platform);
        localStorage.setItem('browser_info', navigator.userAgent);
        
        document.getElementById('siteFooter').innerHTML = `
            <p>ОС: ${localStorage.getItem('os_info')}</p>
            <p>Браузер: ${localStorage.getItem('browser_info')}</p>
        `;

        // 2. Асинхронний JavaScript (Fetch API)
        fetch('https://jsonplaceholder.typicode.com/posts/9/comments')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('reviewsContainer');
                data.forEach(comment => {
                    const div = document.createElement('div');
                    div.className = 'review-card';
                    div.innerHTML = `<strong>${comment.name}</strong> (${comment.email})<br><p>${comment.body}</p>`;
                    container.appendChild(div);
                });
            })
            .catch(error => console.error('Помилка завантаження:', error));

        // 3. Слухачі подій та Таймери: Модальне вікно через 1 хвилину (60000 мс)
        setTimeout(() => {
            document.getElementById('feedbackModal').style.display = 'block';
        }, 60000);

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('feedbackModal').style.display = 'none';
        });

        // 4. Дата та Час: Перемикач теми
        const applyTheme = () => {
            const hour = new Date().getHours();
            if (hour >= 7 && hour < 21) {
                document.body.classList.remove('dark-mode');
            } else {
                document.body.classList.add('dark-mode');
            }
        };
        
        applyTheme(); // Перевірка при завантаженні сторінки

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
